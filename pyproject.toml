[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-treat-feeder"
version = "0.1.0"
description = "Raspberry Pi cat treat dispenser controlled from Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "python-telegram-bot>=21,<23",
    "APScheduler>=3.10,<4",
    "pydantic>=2.5,<3",
    "PyYAML>=6",
    "python-dotenv>=1",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pre-commit>=3"]

[project.scripts]
feeder = "feeder.app:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
